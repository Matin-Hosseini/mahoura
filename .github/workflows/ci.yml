name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Unit / API E2E / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

      - name: NestJS API end-to-end tests
        run: pnpm test:e2e:api

      - name: Build
        run: pnpm build

  docker:
    name: Docker / Development / Production / Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate ephemeral CI credentials
        run: node scripts/init-docker-env.mjs
      - name: Validate Compose models
        run: |
          docker compose --env-file .env.dev -f compose.dev.yaml config --quiet
          docker compose --env-file .env.prod -f compose.prod.yaml config --quiet
      - name: Start development stack
        run: docker compose --env-file .env.dev -f compose.dev.yaml up --build -d --wait --wait-timeout 300
      - name: Start production stack alongside development
        run: docker compose --env-file .env.prod -f compose.prod.yaml up --build -d --wait --wait-timeout 300
      - name: Smoke test and verify data isolation
        run: node scripts/docker-smoke.mjs both --exercise-dev-recovery
      - name: Print container status on failure
        if: failure()
        run: |
          docker compose --env-file .env.dev -f compose.dev.yaml ps -a
          docker compose --env-file .env.prod -f compose.prod.yaml ps -a
      - name: Remove ephemeral CI resources
        if: always()
        run: |
          docker compose --env-file .env.dev -f compose.dev.yaml down -v --remove-orphans
          docker compose --env-file .env.prod -f compose.prod.yaml down -v --remove-orphans

# Browser E2E (Playwright) is intentionally disabled until its browser
# binary can be installed reliably. The NestJS API E2E suite remains active.
